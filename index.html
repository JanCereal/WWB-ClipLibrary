<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WWB Clip Library</title>
<link rel="icon" type="image/png" href="assets/WWB_ServerIcon2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#191c2b;--panel:#242a40;--line:#36406000;--edge:#39425f;--text:#e9ecf5;--dim:#9aa3bf;--acc:#ffb547;--accInk:#2a1c00;--bad:#ff7a7a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 Barlow,system-ui,sans-serif;min-height:100vh}
h1,h2,.chip,button,.title{font-family:"Barlow Semi Condensed",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:20px clamp(16px,4vw,40px);border-bottom:1px solid var(--edge)}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:12px}
h1 img{border-radius:8px;object-fit:cover;flex:none}
h1 small{font-weight:500;color:var(--dim);font-size:16px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select{background:var(--panel);border:1px solid var(--edge);color:var(--text);border-radius:6px;padding:9px 11px;font:inherit;min-width:0}
input:focus-visible,button:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:6px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
button.bad{color:var(--bad)}
main{padding:20px clamp(16px,4vw,40px) 60px}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row b{color:var(--dim);font-weight:500;min-width:52px}
.chip{border:1px solid var(--edge);background:transparent;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:500;color:var(--dim)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--panel);border-radius:8px;overflow:hidden;border:1px solid var(--edge);display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:16/9;background:#0e1019;cursor:pointer}
.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .fs{position:absolute;bottom:8px;background:rgba(14,16,25,.78);padding:4px 10px;font-size:13px}
.thumb .fs{right:8px}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.title{font-size:19px;font-weight:600;line-height:1.2;margin:0}
.game{color:var(--acc);font-size:14px;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;color:var(--dim);background:#1b2033;border-radius:4px;padding:1px 7px}
.edit{align-self:flex-start;font-size:13px;padding:3px 10px;margin-top:2px}
.empty{color:var(--dim);padding:60px 0;text-align:center}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:10px;padding:22px;width:min(480px,92vw)}
dialog::backdrop{background:rgba(8,9,15,.8)}
dialog h2{margin:0 0 14px;font-size:24px}
label{display:block;margin:10px 0 4px;color:var(--dim);font-size:14px}
dialog input{width:100%}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.note{color:var(--dim);font-size:13px;margin:8px 0 0}
#viewer{width:min(840px,94vw);padding:16px;background:#12151f}
#viewer video{width:100%;max-height:60vh;display:block;background:#000;border-radius:6px}
#vInfo{padding:2px 2px 0}
#vInfo .vrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
#vInfo .game{font-size:16px;margin-right:4px}
#vMeta{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;margin:14px 0 0;color:var(--dim);font-size:14px}
#vMeta dt{color:var(--dim)}#vMeta dd{margin:0;color:var(--text);overflow-wrap:anywhere}
a.btn{display:inline-block;background:var(--acc);color:var(--accInk);border-radius:6px;padding:8px 14px;font:600 15px "Barlow Semi Condensed",system-ui,sans-serif;text-decoration:none}
a.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:500;display:none;max-width:90vw;z-index:9}
.sr{position:absolute;left:-9999px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1><img src="assets/WWB_ServerIcon2.png" alt="" width="44" height="44">WWB Clip Library<small id="count"></small></h1>
  <div class="bar">
    <input id="q" type="search" placeholder="Search clips" aria-label="Search clips">
    <button id="add" class="pri" hidden>Upload clip</button>
    <span id="who" class="tag" hidden></span>
    <button id="login">Log in</button>
  </div>
</header>
<main>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No clips match. Clear a filter or log in to upload one.</p>
</main>

<dialog id="loginDlg">
  <h2>Log in</h2>
  <p class="note" style="margin-top:0">Only people with write access to this GitHub repository can upload or edit. Paste a fine-grained personal access token with <b>Contents: Read and write</b> for this repo.</p>
  <label for="tok">GitHub token</label>
  <input id="tok" type="password" autocomplete="off" placeholder="github_pat_…">
  <p class="note" id="loginErr" style="color:var(--bad)"></p>
  <div class="acts"><button data-close>Cancel</button><button id="loginGo" class="pri">Log in</button></div>
</dialog>

<dialog id="formDlg">
  <h2 id="formTitle">Upload clip</h2>
  <div id="fileWrap">
    <label for="file">Video file (mp4 or webm, up to 25 MB)</label>
    <input id="file" type="file" accept="video/mp4,video/webm">
    <label for="url">Or a video link, or a path like clips/name.mp4 for a file you pushed with git</label>
    <input id="url" placeholder="https://…/clip.mp4 or clips/name.mp4">
  </div>
  <label for="fTitle">Title</label><input id="fTitle">
  <label for="fGame">Game</label><input id="fGame" list="games">
  <datalist id="games"></datalist>
  <label for="fTags">Tags (comma separated, e.g. ace, clutch, funny)</label><input id="fTags">
  <p class="note" id="formErr" style="color:var(--bad)"></p>
  <div class="acts">
    <button id="del" class="bad" hidden>Delete clip</button>
    <button data-close>Cancel</button><button id="save" class="pri">Save</button>
  </div>
</dialog>

<dialog id="viewer">
  <div class="acts" style="margin:0 0 10px;justify-content:space-between;align-items:center">
    <span class="title" id="vTitle"></span>
    <span><button id="vFs">Fullscreen</button> <button data-close>Close</button></span>
  </div>
  <video id="vVid" controls playsinline></video>
  <div id="vInfo"></div>
</dialog>
<div id="toast" role="status"></div>

<script>
/* ---- Config: auto-detects owner/repo on GitHub Pages; edit if you use a custom domain ---- */
const CFG = { owner:"", repo:"", branch:"main", dataFile:"clips.json", clipDir:"clips" };
if(!CFG.owner && location.hostname.endsWith(".github.io")){
  CFG.owner = location.hostname.split(".")[0];
  CFG.repo = location.pathname.split("/")[1] || (CFG.owner + ".github.io");
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let selectedId = "", viewClip = null, loadErr = "", clips = [], token = "", user = "", editing = null, selGame = "", selTags = new Set();
const store = { get(k){try{return sessionStorage.getItem(k)||""}catch(e){return ""}}, set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}, del(k){try{sessionStorage.removeItem(k)}catch(e){}} };

function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",4500)}

/* ---- GitHub API ---- */
async function gh(path, opts={}){
  const r = await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}${path}`, {...opts, headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+token,...(opts.headers||{})}});
  if(!r.ok && r.status!==404) throw new Error((await r.json().catch(()=>({}))).message || r.statusText);
  return r;
}
async function fileSha(path){
  const r = await gh(`/contents/${path}?ref=${CFG.branch}&_=${Date.now()}`, {cache:"no-store"});
  return r.status===404 ? undefined : (await r.json()).sha;
}
const b64text = s => btoa(unescape(encodeURIComponent(s)));
const fileB64 = f => new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});
async function put(path, content, message){
  for(let i=0;i<3;i++){
    try{
      const sha = await fileSha(path);
      await gh(`/contents/${path}`, {method:"PUT", body:JSON.stringify({message, content, branch:CFG.branch, sha})});
      return;
    }catch(e){
      if(i===2 || !/does not match|sha|timed out|try again|timeout/i.test(e.message)) throw e;
      await new Promise(r=>setTimeout(r,2500));
    }
  }
}
function saveClips(message){
  if(loadErr) return Promise.reject(new Error("clips.json could not be read, so saving is blocked to protect your data. Fix the file first."));
  const data = clips.map(({preview,...c})=>c);
  return put(CFG.dataFile, b64text(JSON.stringify(data,null,2)), message);
}

/* ---- Load + render ---- */
async function load(){
  try{
    const r = await fetch(CFG.dataFile + "?t=" + Date.now());
    clips = r.ok ? await r.json() : [];
    loadErr = "";
  }catch(e){ clips = []; loadErr = e.message; }
  render();
}
/* Search: words under 3 letters must match a whole word or tag; longer words match the start of one */
function matches(c, w){
  const toks = [c.title, c.game||"", ...(c.tags||[])].join(" ").toLowerCase().split(/\s+/)
    .flatMap(x => [x, ...x.split(/[^\p{L}\p{N}]+/u)]).filter(Boolean);
  return w.length < 3 ? toks.includes(w) : toks.some(t => t.startsWith(w));
}
function render(){
  const games = [...new Set(clips.map(c=>c.game).filter(Boolean))].sort();
  const pool = clips.filter(c=>!selGame || c.game===selGame);
  const tags = [...new Set(pool.flatMap(c=>c.tags||[]))].sort();
  [...selTags].forEach(t=>{ if(!tags.includes(t)) selTags.delete(t); });
  const chip = (t,on,attr) => `<button class="chip" aria-pressed="${on}" ${attr}="${esc(t)}">${esc(t)}</button>`;
  $("filters").innerHTML =
    (games.length ? `<div class="row"><b>Game</b>${games.map(g=>chip(g,g===selGame,"data-game")).join("")}</div>` : "") +
    (tags.length ? `<div class="row"><b>Tags</b>${tags.map(t=>chip(t,selTags.has(t),"data-tag")).join("")}</div>` : "");
  $("games").innerHTML = games.map(g=>`<option value="${esc(g)}">`).join("");

  const words = $("q").value.toLowerCase().split(/\s+/).filter(Boolean);
  const list = clips.filter(c =>
    (!selGame || c.game===selGame) &&
    [...selTags].every(t => (c.tags||[]).includes(t)) &&
    words.every(w => matches(c,w)));
  $("count").textContent = list.length;
  $("empty").hidden = list.length>0 && !loadErr;
  $("empty").textContent = loadErr ? `clips.json could not be read (${loadErr}). Check it for a missing comma or bracket.` : "No clips match. Clear a filter or log in to upload one.";
  $("grid").innerHTML = list.map(c => {
    const src = c.preview || c.src;
    return `<article class="card${c.id===selectedId?" sel":""}" data-id="${esc(c.id)}">
      <div class="thumb">
        <video src="${esc(src)}#t=0.5" muted loop playsinline preload="metadata"></video>
        <button class="fs" aria-label="Open ${esc(c.title)} fullscreen">Fullscreen</button>
      </div>
      <div class="info">
        <h3 class="title">${esc(c.title)}</h3>
        ${c.game?`<span class="game">${esc(c.game)}</span>`:""}
        <div class="tags">${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        ${token?`<button class="edit" data-edit>Edit tags</button>`:""}
      </div></article>`;
  }).join("");
}

/* ---- Grid interactions ---- */
$("filters").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.game!==undefined) selGame = selGame===b.dataset.game ? "" : b.dataset.game;
  if(b.dataset.tag!==undefined) selTags.has(b.dataset.tag) ? selTags.delete(b.dataset.tag) : selTags.add(b.dataset.tag);
  render();
});
$("q").addEventListener("input", render);

$("grid").addEventListener("click", e=>{
  const card = e.target.closest(".card"); if(!card) return;
  const clip = clips.find(c=>c.id===card.dataset.id);
  if(e.target.closest("[data-edit]")) return openForm(clip);
  if(e.target.closest(".fs")) return openViewer(clip, true);
  if(e.target.closest(".thumb")) openViewer(clip, false);
});
$("grid").addEventListener("mouseover", e=>{
  const t = e.target.closest(".thumb"); if(!t || t.contains(e.relatedTarget)) return;
  t.querySelector("video").play().catch(()=>{});
});
$("grid").addEventListener("mouseout", e=>{
  const t = e.target.closest(".thumb"); if(!t || t.contains(e.relatedTarget)) return;
  const v = t.querySelector("video"); v.pause(); v.currentTime = 0.5;
});

/* ---- Viewer / fullscreen ---- */
function openViewer(c, goFs){
  document.querySelectorAll(".card video").forEach(v=>v.pause());
  viewClip = c; selectedId = c.id;
  document.querySelectorAll(".card").forEach(x=>x.classList.toggle("sel", x.dataset.id===c.id));
  $("vTitle").textContent = c.title;
  const src = c.preview || c.src;
  const file = decodeURIComponent((c.src||"").split("?")[0].split("/").pop() || "clip");
  const ext = (file.match(/\.(\w{2,5})$/)||[,"mp4"])[1];
  const dlName = (c.title.replace(/[^\w\- ]+/g,"").trim() || "clip") + "." + ext;
  let sameOrigin = true; try{ sameOrigin = new URL(src, location.href).origin === location.origin; }catch(e){}
  const dl = sameOrigin ? `<a class="btn" href="${esc(src)}" download="${esc(dlName)}">Download</a>`
                        : `<a class="btn" href="${esc(src)}" target="_blank" rel="noopener">Open video file</a>`;
  $("vInfo").innerHTML =
    `<div class="vrow">${c.game ? `<button class="chip game" data-vgame="${esc(c.game)}">${esc(c.game)}</button>` : ""}` +
    ((c.tags||[]).map(t=>`<button class="chip" data-vtag="${esc(t)}">${esc(t)}</button>`).join("") || `<span class="tag">No tags</span>`) + `</div>` +
    `<dl id="vMeta"><dt>Title</dt><dd>${esc(c.title)}</dd>` +
      `<dt>Game</dt><dd>${esc(c.game || "Not set")}</dd>` +
      `<dt>Added</dt><dd>${esc(c.added || "Unknown")}</dd>` +
      `<dt>File</dt><dd>${esc(file)}</dd>` +
      `<dt>Length</dt><dd id="mLen">…</dd><dt>Resolution</dt><dd id="mRes">…</dd></dl>` +
    `<div class="vrow">${dl}${token ? `<button class="edit" data-vedit>Edit tags</button>` : ""}</div>`;
  $("vVid").src = c.preview || c.src;
  $("viewer").showModal();
  $("vVid").play().catch(()=>{});
  if(goFs) $("vVid").requestFullscreen?.().catch(()=>{});
}
$("vVid").addEventListener("loadedmetadata", ()=>{
  const v = $("vVid"), t = Math.round(v.duration || 0);
  if($("mLen")) $("mLen").textContent = isFinite(v.duration) ? `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}` : "Unknown";
  if($("mRes")) $("mRes").textContent = v.videoWidth ? `${v.videoWidth} × ${v.videoHeight}` : "Unknown";
});
$("viewer").addEventListener("click", e=>{
  const d = $("viewer");
  if(e.target===d) return d.close();
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.vgame!==undefined){ selGame = b.dataset.vgame; d.close(); render(); }
  if(b.dataset.vtag!==undefined){ selTags.add(b.dataset.vtag); d.close(); render(); }
  if(b.dataset.vedit!==undefined){ d.close(); openForm(viewClip); }
});
$("vFs").onclick = () => $("vVid").requestFullscreen?.();
$("viewer").addEventListener("close", ()=>{ $("vVid").pause(); $("vVid").removeAttribute("src"); });
document.addEventListener("click", e=>{ if(e.target.matches("[data-close]")) e.target.closest("dialog").close(); });

/* ---- Login ---- */
async function doLogin(t){
  if(!CFG.owner) throw new Error("Set owner and repo in CFG at the top of the script.");
  token = t;
  const r = await gh("");
  const repo = await r.json();
  if(r.status===404 || !repo.permissions?.push){ token=""; throw new Error("This token has no write access to " + CFG.owner + "/" + CFG.repo + "."); }
  user = "Signed in";
  store.set("clipTok", t);
  $("add").hidden = false; $("who").hidden = false; $("who").textContent = user; $("login").textContent = "Log out";
  render();
}
function logout(){
  token=""; store.del("clipTok");
  $("add").hidden = true; $("who").hidden = true; $("login").textContent = "Log in";
  render();
}
$("login").onclick = () => token ? logout() : ($("loginErr").textContent="", $("loginDlg").showModal());
$("loginGo").onclick = async () => {
  $("loginErr").textContent = "";
  try{ await doLogin($("tok").value.trim()); $("tok").value=""; $("loginDlg").close(); toast("Logged in"); }
  catch(e){ $("loginErr").textContent = e.message; }
};

/* ---- Upload / edit ---- */
function openForm(c){
  editing = c || null;
  $("formTitle").textContent = c ? "Edit clip" : "Upload clip";
  $("fileWrap").hidden = !!c; $("del").hidden = !c;
  $("file").value=""; $("url").value="";
  $("fTitle").value = c?.title || ""; $("fGame").value = c?.game || ""; $("fTags").value = (c?.tags||[]).join(", ");
  $("formErr").textContent = "";
  $("formDlg").showModal();
}
$("add").onclick = () => openForm(null);
const parseTags = s => [...new Set(s.split(",").map(t=>t.trim().toLowerCase()).filter(Boolean))];

$("save").onclick = async () => {
  const btn = $("save"); $("formErr").textContent = "";
  const meta = { title:$("fTitle").value.trim(), game:$("fGame").value.trim(), tags:parseTags($("fTags").value) };
  try{
    btn.disabled = true;
    if(editing){
      if(!meta.title) throw new Error("Add a title.");
      Object.assign(editing, meta);
      btn.textContent = "Saving…";
      await saveClips(`Edit clip: ${meta.title}`);
    }else{
      const f = $("file").files[0], url = $("url").value.trim();
      if(!f && !url) throw new Error("Choose a video file or paste a link.");
      if(!meta.title) meta.title = f ? f.name.replace(/\.[^.]+$/,"") : "Untitled clip";
      if(f && f.size > 25*1024*1024) throw new Error("GitHub's web API can't reliably take files over about 25 MB. Compress the clip, or push it into the clips folder with git and enter its path (clips/name.mp4) in the link field.");
      const id = Date.now().toString(36);
      let clip = { id, ...meta, added:new Date().toISOString().slice(0,10) };
      if(f){
        btn.textContent = "Uploading… (large files can take a minute)";
        const name = `${id}-${f.name.replace(/[^\w.-]+/g,"_")}`;
        await put(`${CFG.clipDir}/${name}`, await fileB64(f), `Add clip file: ${name}`).catch(e=>{throw new Error(/too large/i.test(e.message)?"GitHub refused the file as too large. Compress it below 25 MB or push it with git (see the link field).":e.message)});
        clip.src = `${CFG.clipDir}/${name}`; clip.preview = URL.createObjectURL(f);
      }else clip.src = url;
      clips.unshift(clip);
      btn.textContent = "Saving…";
      await saveClips(`Add clip: ${meta.title}`);
    }
    $("formDlg").close(); render();
    toast("Saved. The site updates for everyone in about a minute.");
  }catch(e){ $("formErr").textContent = e.message; if(editing===null && clips[0] && !clips[0].saved) load(); }
  finally{ btn.disabled=false; btn.textContent="Save"; }
};
$("del").onclick = async () => {
  if(!editing || !confirm(`Delete "${editing.title}"?`)) return;
  try{
    if(editing.src.startsWith(CFG.clipDir + "/")){
      const sha = await fileSha(editing.src);
      if(sha) await gh(`/contents/${editing.src}`, {method:"DELETE", body:JSON.stringify({message:"Delete clip file", sha, branch:CFG.branch})});
    }
    clips = clips.filter(c=>c!==editing);
    await saveClips(`Delete clip: ${editing.title}`);
    $("formDlg").close(); render(); toast("Clip deleted.");
  }catch(e){ $("formErr").textContent = e.message; }
};

/* ---- Start ---- */
load();
const saved = store.get("clipTok");
if(saved) doLogin(saved).catch(()=>logout());
</script>
</body>
</html>
